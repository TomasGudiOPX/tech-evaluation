name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory
        id: yarn-cache
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"

      - name: Cache yarn dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Lint ESLint
        run: yarn lint:eslint

      - name: Format check
        run: yarn format:check

      - name: Build contracts
        run: yarn workspace @vps-template/contracts build

      - name: Generate Prisma client
        run: yarn workspace @vps-template/api prisma:generate

      - name: Build API
        run: yarn workspace @vps-template/api build

      - name: Test API
        run: yarn workspace @vps-template/api test

      - name: Build web
        run: yarn workspace @vps-template/web build

      - name: Build workspace
        run: yarn build
